server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Hashed build assets are immutable and safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # These must never be cached: index.html is the app shell and
    # env-config.js is rewritten per deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths return the app shell, never a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
